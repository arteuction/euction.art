<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auctions Management | ART EUction Admin</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .admin-container { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; background: var(--gray-50); }
    .admin-sidebar { background: var(--gray-900); color: white; padding: 2rem 0; position: fixed; width: 250px; height: 100vh; overflow-y: auto; }
    .admin-sidebar h2 { color: white; padding: 0 1.5rem; margin-bottom: 2rem; font-size: 1.5rem; }
    .admin-nav { list-style: none; padding: 0; margin: 0; }
    .admin-nav a { display: flex; align-items: center; padding: 1rem 1.5rem; color: var(--gray-300); text-decoration: none; transition: all 0.2s; }
    .admin-nav a:hover, .admin-nav a.active { background: rgba(255, 255, 255, 0.1); color: white; }
    .admin-nav a .icon { margin-right: 0.75rem; font-size: 1.25rem; }
    .admin-content { margin-left: 250px; padding: 2rem; }
    .admin-header { background: white; padding: 1.5rem 2rem; margin: -2rem -2rem 2rem -2rem; border-bottom: 1px solid var(--gray-200); display: flex; justify-content: space-between; align-items: center; }
    .section-card { background: white; padding: 2rem; border-radius: 0.5rem; border: 1px solid var(--gray-200); margin-bottom: 2rem; }
    .filters { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .filter-btn { padding: 0.5rem 1rem; border: 1px solid var(--gray-300); background: white; border-radius: 0.25rem; cursor: pointer; }
    .filter-btn.active { background: var(--accent-cyan); color: white; border-color: var(--accent-cyan); }
    table { width: 100%; border-collapse: collapse; }
    table th { text-align: left; padding: 0.75rem; background: var(--gray-50); font-weight: 600; font-size: 0.875rem; color: var(--gray-800); border-bottom: 2px solid var(--gray-200); }
    table td { padding: 0.75rem; border-bottom: 1px solid var(--gray-100); }
    table tr:hover { background: var(--gray-50); }
    .status-badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 1rem; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
    .status-badge.upcoming { background: #D1ECF1; color: #0C5460; }
    .status-badge.active { background: #D4EDDA; color: #155724; }
    .status-badge.ended { background: #F8D7DA; color: #721C24; }
    .action-btn { padding: 0.375rem 0.75rem; font-size: 0.875rem; border: none; border-radius: 0.25rem; cursor: pointer; margin-right: 0.5rem; color: white; }
    .action-btn.edit { background: var(--accent-cyan); }
    .action-btn.end { background: var(--error-red); }
    .action-btn:hover { opacity: 0.9; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; overflow-y: auto; }
    .modal.active { display: flex; align-items: start; justify-content: center; padding: 2rem; }
    .modal-content { background: white; padding: 2rem; border-radius: 0.5rem; max-width: 600px; width: 100%; margin: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .modal-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; }
    .form-group { margin-bottom: 1.5rem; }
    .form-label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--gray-900); }
    .form-control { width: 100%; padding: 0.75rem; border: 1px solid var(--gray-300); border-radius: 0.25rem; font-size: 1rem; }
  </style>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
</head>
<body>

  <div class="admin-container">
    <aside class="admin-sidebar">
      <h2>🎨 Admin Panel</h2>
      <ul class="admin-nav">
        <li><a href="dashboard.html"><span class="icon">📊</span> Dashboard</a></li>
        <li><a href="artists.html"><span class="icon">👨‍🎨</span> Artists</a></li>
        <li><a href="artworks.html"><span class="icon">🖼️</span> Artworks</a></li>
        <li><a href="auctions.html" class="active"><span class="icon">⚡</span> Auctions</a></li>
        <li><a href="ngos.html"><span class="icon">🤝</span> NGOs</a></li>
        <li><a href="users.html"><span class="icon">👥</span> Users</a></li>
        <li><a href="analytics.html"><span class="icon">📈</span> Analytics</a></li>
        <li><a href="../index.html"><span class="icon">🏠</span> Back to Site</a></li>
      </ul>
    </aside>

    <main class="admin-content">
      <div class="admin-header">
        <h1 style="margin: 0;">Auctions Management</h1>
        <button class="btn btn-primary" onclick="openCreateAuctionModal()">+ Create Auction</button>
      </div>

      <div class="section-card">
        <div class="filters">
          <button class="filter-btn active" data-status="all">All Auctions</button>
          <button class="filter-btn" data-status="upcoming">Upcoming</button>
          <button class="filter-btn" data-status="active">Active</button>
          <button class="filter-btn" data-status="ended">Ended</button>
        </div>

        <table id="auctions-table">
          <thead>
            <tr>
              <th>Artwork</th>
              <th>Artist</th>
              <th>Start Date</th>
              <th>End Date</th>
              <th>Current Bid</th>
              <th>Bids</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="8" style="text-align: center; padding: 2rem; color: var(--gray-500);">
                Loading auctions...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Create/Edit Auction Modal -->
  <div class="modal" id="auction-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Create New Auction</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <form id="auction-form">
        <div class="form-group">
          <label class="form-label" for="artwork-select">Select Artwork *</label>
          <select id="artwork-select" class="form-control" required>
            <option value="">Loading approved artworks...</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="ngo-select">Select NGO Beneficiary *</label>
          <select id="ngo-select" class="form-control" required>
            <option value="">Loading verified NGOs...</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="starting-bid">Starting Bid (USD) *</label>
          <input type="number" id="starting-bid" class="form-control" required min="100" step="100">
        </div>

        <div class="form-group">
          <label class="form-label" for="start-date">Start Date & Time *</label>
          <input type="datetime-local" id="start-date" class="form-control" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="end-date">End Date & Time *</label>
          <input type="datetime-local" id="end-date" class="form-control" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="featured">Featured Auction</label>
          <input type="checkbox" id="featured" style="width: auto; margin-left: 0.5rem;">
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
          <button type="submit" class="btn btn-primary" style="flex: 1;">Create Auction</button>
          <button type="button" class="btn btn-secondary" style="flex: 1;" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="../js/admin-auctions.js"></script>
</body>
</html>
